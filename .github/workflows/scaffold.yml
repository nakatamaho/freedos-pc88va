name: Scaffold validation

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check component remote script syntax
        run: bash -n tools/configure_component_remotes.sh

      - name: Configure and verify component remotes
        run: tools/configure_component_remotes.sh

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify scaffold
        run: make verify-scaffold
