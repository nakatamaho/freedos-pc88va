# SPDX-License-Identifier: GPL-2.0-or-later
name: M14 floppy writes and media changes

on:
  push:
    branches: ['topic/m14-floppy-write-media-change']
  pull_request:
    paths: ['tools/m14/**', 'tests/m14/**', 'config/m14/**', 'schema/m14-*', 'qa/golden/m14/**', 'manifests/m14-*', 'tools/m13/**', 'tests/m13/**', 'components/fdkernel', 'Makefile', '.github/workflows/m14-floppy-write.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GH_TOKEN: ${{ github.token }}

jobs:
  public-floppy-write:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {submodules: recursive, fetch-depth: 0}
      - name: Install pinned ROM-free test dependencies
        run: |
          test "$(uname -m)" = x86_64
          test "$(dpkg --print-architecture)" = amd64
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm
          python3 -m pip install --disable-pip-version-check --user --ignore-installed -r tools/m14/requirements.txt
      - name: Validate actual schemas and source bindings
        run: |
          bash tools/configure_component_remotes.sh
          python3 -B tools/m14/preflight.py --output build/m14-preflight
          make m14-verify
      - name: Build locked Open Watcom container
        run: make m01-image
      - name: Two isolated common-kernel and fixture builds
        run: python3 -B tools/m14/build_public.py --output build/m14-ci
      - name: Shared acceptance verifier
        run: make m14-accept M14_BUILD_ROOT=build/m14-ci
      - name: Confirm clean sources
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
  historical-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {submodules: recursive, fetch-depth: 0}
      - name: Install ROM-free dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm
          python3 -m pip install --disable-pip-version-check --user --ignore-installed -r tools/m14/requirements.txt
          python3 -m pip install --disable-pip-version-check --user --ignore-installed -r tools/m08/requirements.txt
      - name: Immutable M08 through M13 public regression
        run: python3 -B tools/m14/historical_regression.py --output build/m14-historical
      - name: Confirm clean sources
        run: git diff --exit-code
