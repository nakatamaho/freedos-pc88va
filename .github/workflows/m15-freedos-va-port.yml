# SPDX-License-Identifier: GPL-2.0-or-later
name: M15 FreeDOS PC-88VA port host verification

on:
  push:
    branches: ['topic/m15-dos-api-writable-session']
  pull_request:
    paths:
      - '.github/workflows/m15-freedos-va-port.yml'
      - 'components/fdkernel'
      - 'config/m15/**'
      - 'docs/porting/m15-*.md'
      - 'tests/m15/**'
      - 'tests/m13/test_memory_placement.py'
      - 'tests/m13/test_m13_public.py'
      - 'tests/qa/test_milestone_acceptance.py'
      - 'tools/m13/build_compressed_kernel.py'
      - 'tools/m15/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  public-port:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Assert native x64 and configure component remotes
        run: |
          test "$(uname -m)" = x86_64
          test "$(dpkg --print-architecture)" = amd64
          bash tools/configure_component_remotes.sh
      - name: Install pinned ROM-free test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm
          python3 -m pip install --disable-pip-version-check --user --ignore-installed -r tools/m15/requirements.txt
      - name: Verify the finite FreeDOS port boundary
        run: |
          python3 -B tools/m15/verify_api_inventory_scope.py
          python3 -B -m unittest discover -s tests/m15 -p 'test_*.py'
      - name: Run M15 parent acceptance and memory-placement regressions
        run: |
          python3 -B -m unittest discover -s tests/qa -p 'test_milestone_acceptance.py'
      - name: Run the complete PC-88VA kernel component suite
        run: python3 -B -m unittest discover -s components/fdkernel/pc88va/tests -p 'test_*.py'
      - name: Confirm public sources remain clean
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
